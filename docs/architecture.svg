<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>lucerne-temp: feature, training and inference pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- data source -->
  <rect x="10" y="150" width="150" height="70" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="85" y="180" text-anchor="middle" font-weight="600">Open-Meteo API</text>
  <text x="85" y="200" text-anchor="middle" fill="#555">hourly temperature_2m</text>

  <!-- feature pipeline -->
  <rect x="190" y="40" width="200" height="90" rx="8" fill="#e6f0fb" stroke="#1f6fc5"/>
  <text x="290" y="66" text-anchor="middle" font-weight="600">Feature pipeline</text>
  <text x="290" y="86" text-anchor="middle" fill="#333">features/backfill.py</text>
  <text x="290" y="104" text-anchor="middle" fill="#333">data/temperature_snapshot.csv</text>
  <text x="290" y="120" text-anchor="middle" fill="#555" font-size="11">committed once, read offline</text>

  <!-- shared feature function -->
  <rect x="200" y="160" width="180" height="60" rx="8" fill="#fff6d6" stroke="#b58a00"/>
  <text x="290" y="186" text-anchor="middle" font-weight="600">features/build.py</text>
  <text x="290" y="205" text-anchor="middle" fill="#333">build_features(): one function</text>

  <!-- training pipeline -->
  <rect x="430" y="40" width="180" height="90" rx="8" fill="#e8f6ea" stroke="#2a8a3c"/>
  <text x="520" y="66" text-anchor="middle" font-weight="600">Training pipeline</text>
  <text x="520" y="86" text-anchor="middle" fill="#333">training/train.py</text>
  <text x="520" y="104" text-anchor="middle" fill="#333">out-of-time split, MAE</text>
  <text x="520" y="120" text-anchor="middle" fill="#555" font-size="11">vs persistence baseline</text>

  <!-- registry -->
  <rect x="660" y="40" width="180" height="90" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="750" y="66" text-anchor="middle" font-weight="600">Model registry</text>
  <text x="750" y="86" text-anchor="middle" fill="#333">registry/registry.json</text>
  <text x="750" y="104" text-anchor="middle" fill="#333">temp-forecaster@champion</text>
  <text x="750" y="120" text-anchor="middle" fill="#555" font-size="11">promotion gate moves the alias</text>

  <!-- inference pipeline -->
  <rect x="430" y="250" width="410" height="110" rx="8" fill="#fbe9f1" stroke="#c2185b"/>
  <text x="635" y="276" text-anchor="middle" font-weight="600">Inference pipeline · Cloud Run service lucerne-temp</text>
  <text x="535" y="302" text-anchor="middle" fill="#333">inference/api.py</text>
  <text x="535" y="320" text-anchor="middle" fill="#333">POST /predict · GET /health</text>
  <text x="745" y="302" text-anchor="middle" fill="#333">inference/batch.py</text>
  <text x="745" y="320" text-anchor="middle" fill="#333">predictions/latest.csv, hourly</text>
  <text x="635" y="346" text-anchor="middle" fill="#555" font-size="11">every prediction carries model_version, feature_time, feature_source</text>

  <!-- UI -->
  <rect x="870" y="270" width="75" height="70" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="907" y="300" text-anchor="middle" font-weight="600">UI</text>
  <text x="907" y="320" text-anchor="middle" fill="#555" font-size="11">ui/app.py</text>

  <!-- arrows -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M160 165 L190 110"/>
    <path d="M390 85 L430 85"/>
    <path d="M610 85 L660 85"/>
    <path d="M750 130 L750 250"/>
    <path d="M160 210 C 230 300, 330 305, 430 305"/>
    <path d="M840 305 L870 305"/>
  </g>
  <g stroke="#b58a00" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)">
    <path d="M380 180 L470 130"/>
    <path d="M380 205 L470 250"/>
  </g>

  <text x="140" y="135" fill="#555" font-size="11">once</text>
  <text x="250" y="322" fill="#555" font-size="11">live, 3 s timeout;</text>
  <text x="250" y="337" fill="#555" font-size="11">fallback: snapshot</text>
  <text x="758" y="195" fill="#555" font-size="11">resolve alias,</text>
  <text x="758" y="210" fill="#555" font-size="11">load at startup</text>
  <text x="290" y="238" text-anchor="middle" fill="#8a6a00" font-size="11">imported by training and inference</text>
</svg>
